[project]
name = "clite"
version = "0.1.0"
description = "clite — command line task engine for apitracker.ru"
requires-python = ">=3.13"
dependencies = [
  "typer>=0.13.0",
  "httpx>=0.27.0",
  "rich>=13.9.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6",
  "mypy>=1.13",
  "types-pyyaml>=6.0.12",
  "testcontainers[postgres]>=4.8.0",
]

[project.scripts]
clite = "clite.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clite"]
