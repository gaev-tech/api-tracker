[project]
name = "apit"
version = "0.1.0"
description = "api-tracker CLI client"
requires-python = ">=3.13"
dependencies = [
  "typer>=0.13.0",
  "httpx>=0.27.0",
  "rich>=13.9.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6",
  "mypy>=1.13",
  "types-pyyaml>=6.0.12",
]

[project.scripts]
apit = "apit.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apit"]
