[tool.uv.workspace]
members = [
  "backend/tasks-service",
  "backend/auth-service",
  "cli",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = [
  "backend/tasks-service/src",
  "backend/auth-service/src",
  "cli/src",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "ANN",  # flake8-annotations (стайлгайд architecture.md §19.1.2)
  "S",    # flake8-bandit (security)
  "RUF",  # ruff-specific
]
ignore = [
  "ANN401",  # Allow Any explicitly when justified (architecture.md §19.1.6)
  "S101",    # Allow assert in tests
  "RUF001",  # ruff жалуется на похожие кириллические/латинские в идентификаторах
  "RUF002",  # ... и в docstrings (у нас русские комментарии — false-positive)
  "RUF003",  # ... и в комментариях
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
testpaths = ["backend/tasks-service/tests", "backend/auth-service/tests", "cli/tests"]
