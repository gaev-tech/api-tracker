# Static APT repository served at apt.apitracker.ru.
# Spec: architecture.md §15.9.5, implementation-plan.md §6.3.4.
#
# Layout (on the prod host):
#   /var/lib/api-tracker/apt/public/        — aptly publish root (dists/, pool/)
#   /var/lib/api-tracker/apt/key.gpg        — exported public GPG key
#
# This vhost is intentionally HTTP-cache-friendly: clients (apt-get update)
# pull Release / InRelease / Packages.gz frequently; the actual .deb files
# are large but immutable per version.

server {
    listen 80;
    server_name apt.apitracker.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name apt.apitracker.ru;

    ssl_certificate     /etc/letsencrypt/live/apt.apitracker.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apt.apitracker.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;

    root /var/lib/api-tracker/apt/public;

    # Index off — APT never browses the tree; deny directory listing.
    autoindex off;

    # Public GPG key is served from the parent dir (outside `public/`),
    # which is the aptly publish root. Map it explicitly.
    location = /key.gpg {
        alias /var/lib/api-tracker/apt/key.gpg;
        types { } default_type application/pgp-keys;
    }

    location /dists/ {
        try_files $uri =404;
        # Release / InRelease / Packages — change frequently, do not cache long.
        add_header Cache-Control "public, max-age=60, must-revalidate";
    }

    location /pool/ {
        try_files $uri =404;
        # .deb files are immutable per (package, version, arch).
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = / {
        return 200 "apt.apitracker.ru — clite APT repository\nUsage: https://apitracker.ru/installation\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 404;
    }
}
