# Production docker-compose.
# Запускается на проде, путь /opt/api-tracker/repo/deploy/.
# См. specs/architecture.md §17.

name: api-tracker

services:
  nginx:
    image: nginx:alpine
    container_name: api-tracker-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /var/lib/api-tracker/certbot/conf:/etc/letsencrypt:ro
      - /var/lib/api-tracker/certbot/www:/var/www/certbot:ro
      # docs-client SPA — статический артефакт; обновляется в CI и копируется
      # в /var/lib/api-tracker/docs-client/ (см. deploy/scripts/pull-and-up.sh).
      - /var/lib/api-tracker/docs-client:/var/www/docs-client:ro
    depends_on:
      tasks-svc:
        condition: service_healthy
    networks:
      - internal
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''

  postgres:
    image: postgres:16-alpine
    container_name: api-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: tasks
    volumes:
      - /var/lib/api-tracker/postgres:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasks"]
      interval: 10s
      timeout: 3s
      retries: 5

  tasks-svc:
    image: ghcr.io/gaev-tech/api-tracker/tasks-svc:main
    container_name: api-tracker-tasks-svc
    restart: unless-stopped
    environment:
      AUTH_MODE: ${AUTH_MODE:-disabled}
      SOLO_USER_EMAIL: ${SOLO_USER_EMAIL:-solo@local}
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/tasks
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  auth-svc:
    image: ghcr.io/gaev-tech/api-tracker/auth-svc:main
    container_name: api-tracker-auth-svc
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/auth
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://apitracker.ru}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@apitracker.ru}
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64:-}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  certbot:
    image: certbot/certbot:latest
    container_name: api-tracker-certbot
    restart: unless-stopped
    volumes:
      - /var/lib/api-tracker/certbot/conf:/etc/letsencrypt
      - /var/lib/api-tracker/certbot/www:/var/www/certbot
    entrypoint: '/bin/sh -c ''trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'''

networks:
  internal:
    driver: bridge
