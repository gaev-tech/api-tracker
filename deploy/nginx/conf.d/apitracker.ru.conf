# Единый хост apitracker.ru с path-based маршрутизацией.
# См. specs/architecture.md §2.

server {
    listen 80;
    server_name apitracker.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name apitracker.ru;

    ssl_certificate     /etc/letsencrypt/live/apitracker.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apitracker.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;

    # Мониторинг и проверка деплоя (ARCH §2.2).
    location = /healthz {
        proxy_pass http://tasks-svc:8000/healthz;
        proxy_set_header Host $host;
    }

    # tasks-svc REST под /api/v1/* (ARCH §2.3); nginx стрипает /api.
    location /api/v1/ {
        proxy_pass http://tasks-svc:8000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # OpenAPI и docs tasks-svc на /api/openapi.json и /api/docs (для отладки).
    location /api/openapi.json {
        proxy_pass http://tasks-svc:8000/openapi.json;
        proxy_set_header Host $host;
    }
    location /api/docs {
        proxy_pass http://tasks-svc:8000/docs;
        proxy_set_header Host $host;
    }

    # auth-svc REST под /api/auth/* (ARCH §2.4); включается в M2.
    location /api/auth/ {
        return 503 "auth-svc coming in M2\n";
        add_header Content-Type text/plain;
    }

    # auth-client SPA под /auth/* (ARCH §2.5); включается в M2.
    location /auth/ {
        return 503 "auth-client coming in M2\n";
        add_header Content-Type text/plain;
    }

    # docs-client SPA по корню (ARCH §2.6); включается в M4.
    location / {
        return 503 "docs-client coming in M4\n";
        add_header Content-Type text/plain;
    }
}
