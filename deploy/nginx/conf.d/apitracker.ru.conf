# Корневой домен redirect на docs (specs/architecture.md §2.1).

server {
    listen 80;
    server_name apitracker.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://docs.apitracker.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name apitracker.ru;

    ssl_certificate     /etc/letsencrypt/live/apitracker.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apitracker.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;

    return 301 https://docs.apitracker.ru$request_uri;
}
