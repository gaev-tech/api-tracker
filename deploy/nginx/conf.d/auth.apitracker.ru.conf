# auth.apitracker.ru — заглушка в M0. Реализация в M2,
# см. specs/implementation-plan.md §4.

server {
    listen 80;
    server_name auth.apitracker.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name auth.apitracker.ru;

    ssl_certificate     /etc/letsencrypt/live/auth.apitracker.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.apitracker.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;

    location / {
        return 503 "auth-client coming in M2\n";
        add_header Content-Type text/plain;
    }
}
