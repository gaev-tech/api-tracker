name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.4"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy backend/tasks-service/src

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.4"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --all-extras
      - working-directory: backend/tasks-service
        run: uv run pytest -q
      - working-directory: backend/auth-service
        run: uv run pytest -q
      - name: cli-cases-coverage (M2.16, ARCH §18.1.5)
        run: uv run python scripts/check_cli_coverage.py

  build-push:
    runs-on: ubuntu-latest
    needs: [python-lint, python-test]
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        name: Compute tag
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "image-tag=$SHORT_SHA" >> "$GITHUB_OUTPUT"
      - name: Build and push tasks-svc
        uses: docker/build-push-action@v6
        with:
          context: backend/tasks-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/tasks-svc:main
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/tasks-svc:${{ steps.meta.outputs.image-tag }}
          cache-from: type=gha,scope=tasks-svc
          cache-to: type=gha,mode=max,scope=tasks-svc
      - name: Build and push auth-svc
        uses: docker/build-push-action@v6
        with:
          context: backend/auth-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/auth-svc:main
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/auth-svc:${{ steps.meta.outputs.image-tag }}
          cache-from: type=gha,scope=auth-svc
          cache-to: type=gha,mode=max,scope=auth-svc

  build-docs:
    runs-on: ubuntu-latest
    needs: [python-lint, python-test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.4"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --all-extras
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend deps
        working-directory: frontend
        run: npm --registry https://registry.npmjs.org/ install --legacy-peer-deps
      - name: Build docs-client (generators + ng build)
        working-directory: frontend
        run: npm --registry https://registry.npmjs.org/ run build:docs
      - name: Upload docs-client artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-client
          path: frontend/dist/docs-client/browser
          if-no-files-found: error
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: [build-push, build-docs]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-client
          path: docs-client-dist
      - name: Pack docs-client tarball
        run: tar -C docs-client-dist -czf docs-client.tar.gz .
      - name: Ship docs-client to prod (ARCH §16.4)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docs-client.tar.gz"
          target: "/opt/api-tracker/"
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,SMTP_HOST,SMTP_PORT,SMTP_FROM,SMTP_PASSWORD
          script: |
            export GHCR_USER="${{ github.actor }}"
            export GHCR_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            export SMTP_HOST="${SMTP_HOST:-}"
            export SMTP_PORT="${SMTP_PORT:-587}"
            export SMTP_FROM="${SMTP_FROM:-noreply@apitracker.ru}"
            export SMTP_PASSWORD="${SMTP_PASSWORD:-}"
            /opt/api-tracker/repo/deploy/scripts/pull-and-up.sh
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

  record-deploy:
    runs-on: ubuntu-latest
    needs: deploy
    # GITHUB_TOKEN не имеет права писать в Actions variables;
    # для variable set нужен PAT с repo+admin:actions, либо
    # GitHub App. Откладываем до M2 — пока используем git tag
    # последнего успешного деплоя.
    if: false
    steps:
      - name: Update LAST_DEPLOYED_SHA variable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh variable set LAST_DEPLOYED_SHA --body "${{ github.sha }}" --repo "${{ github.repository }}"
