name: Release

# Триггерится тегом vX.Y.Z в этом monorepo.
# Собирает CLI-бинари и публикует Release в публичный репо
# gaev-tech/clite (architecture.md §15.8.4, §15.8.5).
#
# В M0 — структура workflow без полноценной сборки (cli/ пустой).
# В M1 — добавляется реальный pyinstaller для macOS arm64
#         (implementation-plan.md §3.2.9).
# В M2 — расширяется на полную matrix (linux-amd64, darwin-amd64,
#         windows-amd64) (implementation-plan.md §4.2.6.1).
# В M4.B — активируются jobs publish-pypi, publish-homebrew,
#         publish-apt, publish-npm (implementation-plan.md §6.3).
#         Каждый job условно skip'ается если требуемый repo-secret пуст,
#         что позволяет постепенно подключать каналы по мере регистрации
#         пакетов на pypi.org/npmjs.com и настройки tap-репо / apt-сервера.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CLI_NAME: clite
  PUBLIC_REPO: gaev-tech/clite

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      is-prerelease: ${{ steps.tag.outputs.is-prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        name: Parse tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "is-prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing $TAG (version=$VERSION)"

  build-binaries:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # arm64 — M1+
            asset: clite-darwin-arm64
            enabled-from: M1
          - os: macos-13            # amd64 — M2+ (Intel runner; free-tier queue
            asset: clite-darwin-amd64 # may stall 30+ min — non-blocking for release)
            enabled-from: M2
            continue-on-error: true
          - os: ubuntu-latest       # linux amd64 — M2+
            asset: clite-linux-amd64
            enabled-from: M2
          - os: windows-latest      # windows amd64 — M2+
            asset: clite-windows-amd64.exe
            enabled-from: M2
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue-on-error == true }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check CLI source presence
        id: cli
        shell: bash
        run: |
          if [[ -f cli/src/clite/__main__.py ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLI source not yet implemented (M0 skeleton). Skipping ${{ matrix.asset }}."
          fi

      - if: steps.cli.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.4"

      - if: steps.cli.outputs.ready == 'true'
        run: uv python install 3.13

      - if: steps.cli.outputs.ready == 'true'
        working-directory: cli
        shell: bash
        run: |
          uv sync --extra dev
          uv run pyinstaller \
            --name clite \
            --onefile \
            --clean \
            --copy-metadata clite \
            src/clite/__main__.py

      - if: steps.cli.outputs.ready == 'true'
        name: Rename artifact
        shell: bash
        working-directory: cli/dist
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            mv clite.exe "${{ matrix.asset }}"
          else
            mv clite "${{ matrix.asset }}"
            chmod +x "${{ matrix.asset }}"
          fi

      - if: steps.cli.outputs.ready == 'true'
        name: Compute SHA256
        shell: bash
        working-directory: cli/dist
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - if: steps.cli.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            cli/dist/${{ matrix.asset }}
            cli/dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  publish-github-release:
    needs: [validate, build-binaries]
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release artifacts
        shell: bash
        run: |
          ls -la release-artifacts/ || echo "No artifacts (CLI source not ready)"

      - name: Publish Release in public repo
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          IS_PRE: ${{ needs.validate.outputs.is-prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Secret PUBLIC_REPO_TOKEN not set. См. SETUP.md."
            exit 1
          fi
          PRE_FLAG=""
          if [[ "$IS_PRE" == "true" ]]; then PRE_FLAG="--prerelease"; fi

          NOTES_FILE=$(mktemp)
          cat > "$NOTES_FILE" <<EOF
          api-tracker CLI \`clite\` v${VERSION}

          Установка — см. README в этом репозитории и docs.apitracker.ru.

          Канонiчный источник: GitHub Releases (этот репо).
          Также доступно: PyPI \`clite\`, Homebrew \`gaev-tech/clite/clite\`,
          APT \`apt.apitracker.ru\`, npm \`@gaev-tech/clite\` (с M4).
          EOF

          ASSETS=()
          if compgen -G "release-artifacts/*" > /dev/null; then
            for f in release-artifacts/*; do
              ASSETS+=("$f")
            done
          fi

          gh release create "v${VERSION}" \
            --repo "${{ env.PUBLIC_REPO }}" \
            --title "v${VERSION}" \
            --notes-file "$NOTES_FILE" \
            $PRE_FLAG \
            "${ASSETS[@]}"

  publish-pypi:
    needs: [validate, publish-github-release]
    # Skip без secret — позволяет релизам проходить до регистрации `clite` на pypi.org.
    if: needs.validate.result == 'success' && needs.publish-github-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PYPI_TOKEN presence
        id: secret
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${PYPI_TOKEN:-}" ]]; then
            echo "has-token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping PyPI publish — secret PYPI_TOKEN is not set. См. SETUP.md."
          else
            echo "has-token=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secret.outputs.has-token == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.4"

      - if: steps.secret.outputs.has-token == 'true'
        run: uv python install 3.13

      - if: steps.secret.outputs.has-token == 'true'
        name: Sync pyproject version with tag
        working-directory: cli
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # Heredoc-only edit (без sed) — sync version в pyproject.toml перед сборкой.
          python3 - <<PYEOF
          import pathlib, re
          p = pathlib.Path("pyproject.toml")
          src = p.read_text()
          new = re.sub(r'^version = "[^"]+"', f'version = "${VERSION}"', src, count=1, flags=re.M)
          p.write_text(new)
          print(f"pyproject.toml -> version = \"${VERSION}\"")
          PYEOF

      - if: steps.secret.outputs.has-token == 'true'
        name: Build sdist + wheel
        working-directory: cli
        run: uv build

      - if: steps.secret.outputs.has-token == 'true'
        name: Publish to PyPI
        working-directory: cli
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish

  publish-homebrew:
    needs: [validate, publish-github-release]
    # Skip без secret — позволяет релизам проходить до создания tap-репо.
    if: needs.validate.result == 'success' && needs.publish-github-release.result == 'success'
    runs-on: ubuntu-latest
    env:
      TAP_REPO: gaev-tech/homebrew-clite
    steps:
      - uses: actions/checkout@v4

      - name: Check HOMEBREW_TAP_TOKEN presence
        id: secret
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "has-token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Homebrew publish — secret HOMEBREW_TAP_TOKEN is not set. См. SETUP.md."
          else
            echo "has-token=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secret.outputs.has-token == 'true'
        name: Download macOS binaries
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - if: steps.secret.outputs.has-token == 'true'
        name: Extract SHA256 sums
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          ARM64_SUM=$(awk '{print $1}' release-artifacts/clite-darwin-arm64.sha256)
          # darwin-amd64 build is continue-on-error — fall back to arm64 sum if missing,
          # so the Formula still renders (Intel users get the arm64 binary via Rosetta).
          if [[ -f release-artifacts/clite-darwin-amd64.sha256 ]]; then
            AMD64_SUM=$(awk '{print $1}' release-artifacts/clite-darwin-amd64.sha256)
          else
            AMD64_SUM="$ARM64_SUM"
            echo "::warning::clite-darwin-amd64.sha256 missing — using arm64 sum as fallback."
          fi
          echo "arm64=$ARM64_SUM" >> "$GITHUB_OUTPUT"
          echo "amd64=$AMD64_SUM" >> "$GITHUB_OUTPUT"

      - if: steps.secret.outputs.has-token == 'true'
        name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap-repo

      - if: steps.secret.outputs.has-token == 'true'
        name: Render Formula
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 cli/homebrew/render_formula.py \
            --version "$VERSION" \
            --sha256-arm64 "${{ steps.sha.outputs.arm64 }}" \
            --sha256-amd64 "${{ steps.sha.outputs.amd64 }}" \
            --out tap-repo/Formula/clite.rb

      - if: steps.secret.outputs.has-token == 'true'
        name: Commit + push Formula
        working-directory: tap-repo
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "gaev-tech-bot"
          git config user.email "bot@gaev.tech"
          git add Formula/clite.rb
          if git diff --cached --quiet; then
            echo "::notice::Formula unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "clite v${VERSION}"
          git push

  publish-apt:
    needs: [validate, build-binaries]
    if: false  # включается в M4 (implementation-plan.md §6.3.4)
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO M4 — собрать .deb, подписать GPG, aptly + SSH"

  publish-npm:
    needs: [validate, publish-github-release]
    if: false  # включается в M4 (implementation-plan.md §6.3.5)
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO M4 — npm publish @gaev-tech/clite"
