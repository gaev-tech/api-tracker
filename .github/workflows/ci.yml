name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.4"
          enable-cache: true
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Install dev deps
        run: uv sync --all-extras
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy strict
        run: uv run mypy backend/tasks-service/src

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.4"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --all-extras
      - name: Pytest tasks-service
        working-directory: backend/tasks-service
        run: uv run pytest -q

  contracts-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.4"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --all-extras
      - name: Dump tasks OpenAPI
        run: |
          uv run python -c "import json; from tasks_service.main import app; print(json.dumps(app.openapi(), indent=2, sort_keys=True))" > contracts/openapi/tasks.json
      - name: Verify OpenAPI committed and matches
        run: |
          git diff --exit-code contracts/openapi/tasks.json || {
            echo "::error::contracts/openapi/tasks.json out of sync. Run dump locally and commit."
            exit 1
          }

  docker-build:
    runs-on: ubuntu-latest
    needs: [python-lint, python-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build tasks-svc image
        uses: docker/build-push-action@v6
        with:
          context: backend/tasks-service
          push: false
          tags: tasks-svc:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
